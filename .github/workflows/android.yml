name: Build Android APK

on:
  push:
    branches: [main]
    # Frontend-only commits still need an APK, but see docs/WORKFLOW.md —
    # day-to-day UI work should use `npm run dev`, not a rebuilt APK.
  workflow_dispatch: # trigger a build by hand from the Actions tab

concurrency:
  # A newer push supersedes an in-flight build.
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the Android platform this project targets
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Verify the rule engine
        run: npm run verify

      - name: Build the web bundle
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK with the build number
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/CheckMyPack-build${{ github.run_number }}.apk"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: CheckMyPack-apk-build${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 60
